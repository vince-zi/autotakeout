<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>今天吃点啥？ | 饮食觉察</title>
    <!-- Premium Google Fonts & Iconography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#08080a',
                        premium: {
                            dark: '#121217',
                            border: '#1e1e26',
                            text: '#7e7e90',
                            accent: '#ffffff',
                            green: '#10b981', // Emerald green for healthy
                            purple: '#8b5cf6',
                            pink: '#ec4899',
                            orange: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #08080a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(18, 18, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* Premium Subtle Glow */
        .hover-glow {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hover-glow:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        /* Dynamic breathing fingerprint scanning glow */
        @keyframes pulse-scan {
            0%, 100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.1); }
            50% { box-shadow: 0 0 45px rgba(16, 185, 129, 0.35); }
        }

        .scanning-active {
            animation: pulse-scan 1.5s infinite;
            border-color: #10b981 !important;
        }
    </style>
</head>

<body class="min-h-screen text-white font-sans p-4 md:p-8 relative selection:bg-white selection:text-black">
    <!-- Floating Organic Blobs -->
    <div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-premium-purple/5 blur-[130px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-premium-green/3 blur-[130px] pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-3xl mx-auto pb-24">

        <!-- Header -->
        <header class="flex justify-between items-center mb-12 pt-4">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-black font-bold text-sm shadow-sm">
                    觉
                </div>
                <span class="font-semibold tracking-wider text-xs uppercase text-white/80">饮食觉察</span>
            </div>
            
            <div class="flex items-center gap-2.5">
                <!-- Location Selector -->
                <button onclick="toggleLocationModal()" class="px-4 py-2 rounded-full border border-premium-border bg-premium-dark/40 hover:bg-premium-dark/80 hover:border-white/20 transition-all text-xs flex items-center gap-1.5 hover-glow select-none">
                    <iconify-icon icon="lucide:map-pin" class="text-premium-green"></iconify-icon>
                    <span id="current-city-name">定位中...</span>
                    <iconify-icon icon="lucide:chevron-down" class="text-[9px] opacity-60"></iconify-icon>
                </button>

                <a href="review-history.html" 
                   class="px-4.5 py-2 rounded-full border border-premium-border bg-premium-dark/40 hover:bg-premium-dark/80 hover:border-white/20 transition-all text-xs flex items-center gap-1.5 hover-glow">
                    <iconify-icon icon="lucide:bar-chart-3" class="text-premium-green"></iconify-icon>
                    <span>复盘看板</span>
                </a>
            </div>
        </header>

        <!-- Brand Title Section -->
        <section class="text-center mb-12">
            <h1 class="text-3xl md:text-5xl font-bold tracking-tight mb-4">
                今天 <span class="italic font-light text-white/90">吃点啥？</span>
            </h1>
            <p class="text-premium-text text-sm max-w-md mx-auto leading-relaxed">
                深夜饮食觉察与情绪对冲。平衡身体的真实渴望，降低吃后的悔恨与内疚。
            </p>
        </section>

        <!-- Selections Container -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">

            <!-- 1. TIME OF DAY -->
            <div class="glass-panel p-6 rounded-[2rem] hover-glow relative overflow-hidden group">
                <h2 class="text-xs tracking-widest text-premium-text mb-4 flex items-center gap-2 font-medium opacity-80">
                    <iconify-icon icon="lucide:clock" class="text-premium-purple"></iconify-icon> 选择时刻
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <button class="choice-btn py-4.5 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-2"
                        onclick="selectOption('time_of_day', 'daytime', this)">
                        <iconify-icon icon="lucide:sun" class="text-lg opacity-60"></iconify-icon>
                        <span>阳光正好 (白天)</span>
                    </button>
                    <button class="choice-btn py-4.5 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-2"
                        onclick="selectOption('time_of_day', 'nighttime', this)">
                        <iconify-icon icon="lucide:moon" class="text-lg opacity-60"></iconify-icon>
                        <span>月色温柔 (夜晚)</span>
                    </button>
                </div>
            </div>

            <!-- 2. EXERCISE -->
            <div class="glass-panel p-6 rounded-[2rem] hover-glow relative overflow-hidden group">
                <h2 class="text-xs tracking-widest text-premium-text mb-4 flex items-center gap-2 font-medium opacity-80">
                    <iconify-icon icon="lucide:activity" class="text-premium-green"></iconify-icon> 运动状态
                </h2>
                <div class="bg-premium-dark/40 border border-premium-border p-4.5 rounded-2xl flex items-center justify-between h-[4.7rem] cursor-pointer transition-all hover:bg-premium-dark/85"
                    id="exercise-card" onclick="toggleExercise()">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-premium-dark border border-premium-border flex items-center justify-center text-lg text-premium-text"
                            id="exercise-icon-bg">
                            🥔
                        </div>
                        <div>
                            <span class="block font-bold text-sm" id="exercise-text">今天没动弹</span>
                            <span class="text-[10px] text-premium-text block mt-0.5" id="exercise-subtext">做一个快乐的小土豆</span>
                        </div>
                    </div>
                    
                    <!-- Switch control -->
                    <div class="w-11 h-5.5 rounded-full bg-premium-dark border border-premium-border relative p-0.5 transition-all" id="exercise-switch">
                        <div class="w-4 h-4 rounded-full bg-premium-text transition-all transform translate-x-0" id="exercise-dot"></div>
                    </div>
                </div>
            </div>

            <!-- 3. MOOD -->
            <div class="md:col-span-2 glass-panel p-6 rounded-[2rem] hover-glow relative">
                <h2 class="text-xs tracking-widest text-premium-text mb-4 flex items-center gap-2 font-medium opacity-80">
                    <iconify-icon icon="lucide:smile" class="text-premium-pink"></iconify-icon> 精神状态
                </h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1.5"
                        onclick="selectOption('mood', 'stressed', this)">
                        <span class="text-xl">🧠</span>
                        <span class="font-bold text-white/90">压力山大</span>
                    </button>
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1.5"
                        onclick="selectOption('mood', 'homesick', this)">
                        <span class="text-xl">🏡</span>
                        <span class="font-bold text-white/90">想家了</span>
                    </button>
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1.5"
                        onclick="selectOption('mood', 'finished_work', this)">
                        <span class="text-xl">🍻</span>
                        <span class="font-bold text-white/90">开摆犒劳</span>
                    </button>
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1.5"
                        onclick="selectOption('mood', 'lonely', this)">
                        <span class="text-xl">🥀</span>
                        <span class="font-bold text-white/90">有点emo</span>
                    </button>
                </div>
            </div>

            <!-- 4. HUNGER LEVEL -->
            <div class="md:col-span-2 glass-panel p-6 rounded-[2rem] hover-glow">
                <h2 class="text-xs tracking-widest text-premium-text mb-4 flex items-center gap-2 font-medium opacity-80">
                    <iconify-icon icon="lucide:heart" class="text-premium-orange"></iconify-icon> 胃部感官
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="body-options">
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1"
                        onclick="selectBodyOption('hunger_level', 'culinary_hug', this)">
                        <span class="text-xl">💖</span>
                        <span class="font-bold text-white/90">求情绪安慰</span>
                    </button>
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1"
                        onclick="selectBodyOption('hunger_level', 'crunch', this)">
                        <span class="text-xl">🍿</span>
                        <span class="font-bold text-white/90">嘴巴很寂寞</span>
                    </button>
                    <button class="choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/20 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1"
                        onclick="selectBodyOption('hunger_level', 'energy_needed', this)">
                        <span class="text-xl">⚡</span>
                        <span class="font-bold text-white/90">极速补充能量</span>
                    </button>
                </div>
            </div>

            <!-- 5. BUDGET -->
            <div class="md:col-span-2 glass-panel p-6 rounded-[2rem] hover-glow relative overflow-hidden group">
                <div class="absolute -right-6 -bottom-6 text-9xl opacity-[0.02] select-none pointer-events-none group-hover:opacity-[0.04] transition-opacity"
                    id="budget-emoji-bg">
                    🥗
                </div>
                
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs tracking-widest text-premium-text flex items-center gap-2 font-medium opacity-80">
                        <iconify-icon icon="lucide:wallet" class="text-premium-green"></iconify-icon> 预算档位
                    </h2>
                    <div class="flex items-center gap-2">
                        <span id="budget-emoji-small" class="text-base">🥗</span>
                        <span id="budget-display" class="font-semibold text-xs px-3.5 py-1 rounded-full bg-white/5 border border-white/10 text-white/90 transition-all">
                            预计花费
                        </span>
                    </div>
                </div>

                <div class="px-2 pb-2">
                    <input type="range" min="1" max="5" value="3" class="w-full focus:outline-none accent-white"
                        id="budget-slider" oninput="updateBudget(this.value)">
                    <div class="flex justify-between text-[10px] text-premium-text font-medium mt-3 px-1">
                        <span>吃土 🥬</span>
                        <span>凑合 🍜</span>
                        <span>日常 🥗</span>
                        <span>稍微奢侈 🥩</span>
                        <span>大富大贵 🦞</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- 6. MINIMALIST ANALYSIS PORTAL -->
        <section class="flex flex-col items-center justify-center p-8 glass-panel rounded-[2.5rem] border border-premium-border text-center relative overflow-hidden">
            <h3 class="text-sm tracking-wider text-premium-text uppercase mb-1 font-bold">开启理性饮食觉察</h3>
            <p class="text-xs text-premium-text/80 mb-6 max-w-sm">
                结合您当下的身体与精神状况，自动为您匹配并生成最合适的深夜膳食对冲建议。
            </p>
            
            <button onclick="startInstantAnalysis()" id="analyze-action-btn" class="w-full py-4 rounded-2xl bg-premium-green hover:bg-premium-green/90 text-black font-bold text-sm shadow-lg shadow-premium-green/10 transition-all flex items-center justify-center gap-2 active:scale-95">
                <iconify-icon icon="lucide:sparkles" class="text-lg"></iconify-icon>
                <span>立即获取膳食方案</span>
            </button>
        </section>

        <!-- Footer -->
        <footer class="mt-12 text-center opacity-40">
            <p class="text-[10px] tracking-wider">
                饮食觉察 · 顺应身体本能与理性对冲
            </p>
        </footer>

    </div>

    <!-- Script Block -->
    <script>
        // Form Choices State
        const userChoices = {
            time_of_day: null,
            mood: null,
            hunger_level: null,
            exercised_today: null,
            budget_level: 3
        };

        const budgetData = {
            1: { label: "15元以下 (吃土套餐)", emoji: "🥬" },
            2: { label: "15-25元 (凑合吃点)", emoji: "🍜" },
            3: { label: "25-40元 (日常标配)", emoji: "🥗" },
            4: { label: "40-80元 (稍微奢侈)", emoji: "🥩" },
            5: { label: "80元+ (大富大贵)", emoji: "🦞" }
        };

        const choiceLabels = {
            time_of_day: { daytime: '白天', nighttime: '夜晚' },
            mood: { stressed: '压力山大', homesick: '想家了', finished_work: '开摆犒劳', lonely: 'emo孤单' },
            hunger_level: { culinary_hug: '求情绪安慰', crunch: '嘴巴很寂寞', energy_needed: '极速充电' },
            exercised_today: { true: '狠狠流汗', false: '快乐土豆' },
            budget_level: { 1: '吃土套餐', 2: '日常温饱', 3: '白领标配', 4: '吃顿肉肉', 5: '富贵人家' }
        };

        // --- Selections Handler ---

        function selectOption(field, value, element) {
            userChoices[field] = value;

            const parent = element.parentElement;
            const siblings = parent.querySelectorAll('button');

            siblings.forEach(btn => {
                // Reset to default dark style
                btn.className = "choice-btn py-4.5 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/10 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-2 opacity-60 scale-95";
            });

            // Set glowing active style
            let activeClass = "border-premium-purple text-white bg-[#221a30]/30 scale-100 opacity-100 font-bold";
            if (field === 'mood') {
                activeClass = "border-premium-pink text-white bg-[#301a25]/30 scale-100 opacity-100 font-bold";
            }
            
            element.className = `choice-btn py-4.5 rounded-2xl border ${activeClass} transition-all text-sm flex flex-col items-center justify-center gap-2`;

            triggerLightHaptic();
            checkScannerAbility();
        }

        function selectBodyOption(field, value, element) {
            userChoices[field] = value;

            const parent = document.getElementById('body-options');
            const siblings = parent.querySelectorAll('button');

            siblings.forEach(btn => {
                btn.className = "choice-btn py-4 rounded-2xl bg-premium-dark/50 border border-premium-border hover:border-white/10 hover:bg-premium-dark transition-all text-sm flex flex-col items-center justify-center gap-1 opacity-60 scale-95";
            });

            element.className = "choice-btn py-4 rounded-2xl border border-premium-orange bg-[#30221a]/30 text-white font-bold scale-100 opacity-100 flex flex-col items-center justify-center gap-1 transition-all";

            triggerLightHaptic();
            checkScannerAbility();
        }

        function toggleExercise() {
            if (userChoices.exercised_today === null) {
                userChoices.exercised_today = false;
            } else {
                userChoices.exercised_today = !userChoices.exercised_today;
            }
            updateExerciseVisuals();
            checkScannerAbility();
        }

        function updateExerciseVisuals() {
            const iconBg = document.getElementById('exercise-icon-bg');
            const mainText = document.getElementById('exercise-text');
            const subText = document.getElementById('exercise-subtext');
            const card = document.getElementById('exercise-card');
            const sw = document.getElementById('exercise-switch');
            const swDot = document.getElementById('exercise-dot');

            if (userChoices.exercised_today === true) {
                // Active (Yes)
                card.className = "bg-[#16291d]/30 border border-premium-green/40 p-4.5 rounded-2xl flex items-center justify-between h-[4.7rem] cursor-pointer transition-all";
                mainText.innerText = "💦 狠狠流汗了";
                subText.innerText = "对冲高油高盐高爽外卖！";
                subText.className = "text-[10px] text-premium-green font-bold block mt-0.5";
                iconBg.innerText = "💦";
                iconBg.className = "w-9 h-9 rounded-xl bg-premium-green text-black flex items-center justify-center text-lg";
                
                sw.className = "w-11 h-5.5 rounded-full bg-premium-green/20 border border-premium-green/40 relative p-0.5 transition-all";
                swDot.className = "w-4 h-4 rounded-full bg-premium-green transition-all transform translate-x-5";
            } else {
                // Inactive (No)
                card.className = "bg-premium-dark/40 border border-premium-border p-4.5 rounded-2xl flex items-center justify-between h-[4.7rem] cursor-pointer transition-all hover:bg-premium-dark/85";
                mainText.innerText = "🥔 今天当个土豆";
                subText.innerText = "做一个快乐的小土豆";
                subText.className = "text-[10px] text-premium-text block mt-0.5";
                iconBg.innerText = "🥔";
                iconBg.className = "w-9 h-9 rounded-xl bg-premium-dark border border-premium-border flex items-center justify-center text-lg text-premium-text";
                
                sw.className = "w-11 h-5.5 rounded-full bg-premium-dark border border-premium-border relative p-0.5 transition-all";
                swDot.className = "w-4 h-4 rounded-full bg-premium-text transition-all transform translate-x-0";
            }
            triggerLightHaptic();
        }

        function updateBudget(value) {
            userChoices.budget_level = parseInt(value);
            const data = budgetData[value];

            const display = document.getElementById('budget-display');
            const emojiSmall = document.getElementById('budget-emoji-small');
            const emojiBg = document.getElementById('budget-emoji-bg');

            display.innerText = data.label;
            emojiSmall.innerText = data.emoji;
            emojiBg.innerText = data.emoji;

            checkScannerAbility();
        }




        function checkScannerAbility() {
            const btn = document.getElementById('analyze-action-btn');
            if (!btn) return;
            const isCompleted = userChoices.time_of_day !== null && 
                                userChoices.mood !== null && 
                                userChoices.hunger_level !== null && 
                                userChoices.exercised_today !== null;

            if (isCompleted) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function executeRedirect() {
            // Flash screen effect
            const flash = document.createElement('div');
            flash.className = "fixed inset-0 bg-white z-[999] opacity-80 transition-opacity duration-300";
            document.body.appendChild(flash);
            
            sessionStorage.setItem('userChoices', JSON.stringify(userChoices));
            sessionStorage.setItem('choiceLabels', JSON.stringify({
                time: choiceLabels.time_of_day[userChoices.time_of_day],
                mood: choiceLabels.mood[userChoices.mood],
                hunger: choiceLabels.hunger_level[userChoices.hunger_level],
                exercise: choiceLabels.exercised_today[userChoices.exercised_today],
                budget: choiceLabels.budget_level[userChoices.budget_level]
            }));

            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => {
                    flash.remove();
                    window.location.href = 'result.html';
                }, 300);
            }, 250);
        }

        function triggerLightHaptic() {
            if (navigator.vibrate) navigator.vibrate(12);
        }

        function triggerHeavyHaptic() {
            if (navigator.vibrate) navigator.vibrate([20, 15, 20]);
        }

        function showFeedbackToast(message, isSuccess = true) {
            const existToast = document.querySelector('.feedback-toast');
            if (existToast) existToast.remove();

            const toast = document.createElement('div');
            toast.className = `feedback-toast fixed top-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl shadow-xl z-[999] text-xs font-semibold flex items-center gap-2.5 transition-all duration-300 transform -translate-y-4 opacity-0 ${
                isSuccess ? 'bg-premium-green/10 text-premium-green border border-premium-green/20' : 'bg-premium-pink/10 text-premium-pink border border-premium-pink/20'
            }`;
            toast.innerHTML = `<iconify-icon icon="${isSuccess ? 'lucide:check-circle' : 'lucide:alert-circle'}" class="text-sm"></iconify-icon><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('-translate-y-4', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        updateBudget(3);
        
        // --- Geolocation & City Selector ---
        const CITY_MAP = {
            "beijing": "北京", "shanghai": "上海", "guangzhou": "广州", "shenzhen": "深圳",
            "hangzhou": "杭州", "chengdu": "成都", "wuhan": "武汉", "nanjing": "南京",
            "chongqing": "重庆", "xian": "西安", "tianjin": "天津", "suzhou": "苏州",
            "changsha": "长沙", "shenyang": "沈阳", "qingdao": "青岛", "dalian": "大连",
            "xiamen": "厦门", "ningbo": "宁波", "fuzhou": "福州", "wuxi": "无锡",
            "hefei": "合肥", "kunming": "昆明", "harbin": "哈尔滨", "jinan": "济南",
            "foshan": "佛山", "dongguan": "东莞", "wenzhou": "温州"
        };

        let currentCity = localStorage.getItem('userCity') || '';

        async function detectUserCity() {
            if (currentCity) {
                updateLocationUI(currentCity);
                return;
            }
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    if (data.city) {
                        const englishCity = data.city.toLowerCase();
                        const chineseCity = CITY_MAP[englishCity] || data.city;
                        currentCity = chineseCity;
                        localStorage.setItem('userCity', currentCity);
                        updateLocationUI(currentCity);
                        return;
                    }
                }
            } catch (e) {
                console.warn('IP city detection failed:', e);
            }
            // Fallback
            currentCity = "北京";
            localStorage.setItem('userCity', currentCity);
            updateLocationUI(currentCity);
        }

        function updateLocationUI(city) {
            const el = document.getElementById('current-city-name');
            if (el) el.innerText = city + '市';
        }

        function toggleLocationModal() {
            const modal = document.getElementById('city-modal');
            modal.classList.toggle('hidden');
        }

        function selectCity(city) {
            currentCity = city;
            localStorage.setItem('userCity', city);
            updateLocationUI(city);
            toggleLocationModal();
            showFeedbackToast(`📍 定位已切换为：${city}市`, true);
        }

        function saveCustomCity() {
            const val = document.getElementById('custom-city-input').value.trim();
            if (!val) {
                showFeedbackToast("请输入有效的城市名", false);
                return;
            }
            const cleanCity = val.replace(/市|区|县/g, '');
            selectCity(cleanCity);
        }

        // --- Instant Analysis Action ---
        function startInstantAnalysis() {
            const isCompleted = userChoices.time_of_day !== null && 
                                userChoices.mood !== null && 
                                userChoices.hunger_level !== null && 
                                userChoices.exercised_today !== null;

            if (!isCompleted) {
                showFeedbackToast("请先完成上面的 4 个基础觉察选项", false);
                return;
            }

            const btn = document.getElementById('analyze-action-btn');
            btn.disabled = true;
            btn.innerHTML = `<iconify-icon icon="lucide:loader" class="text-lg animate-spin"></iconify-icon><span>正在分析体感...</span>`;

            setTimeout(() => {
                executeRedirect();
            }, 600);
        }

        // Detect city on load
        document.addEventListener('DOMContentLoaded', () => {
            detectUserCity();
        });
    </script>

    <!-- City Selection Modal -->
    <div id="city-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/85 backdrop-blur-md">
        <div class="glass-panel p-6 rounded-[2rem] border border-premium-border max-w-sm w-full text-center relative overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
                    <iconify-icon icon="lucide:map-pin" class="text-premium-green"></iconify-icon>
                    <span>选择您所在的城市</span>
                </h3>
                <button onclick="toggleLocationModal()" class="text-premium-text hover:text-white transition-colors">
                    <iconify-icon icon="lucide:x" class="text-lg"></iconify-icon>
                </button>
            </div>
            
            <!-- Quick City Choices -->
            <div class="grid grid-cols-3 gap-2.5 mb-5">
                <button onclick="selectCity('北京')" class="py-2 px-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-green hover:bg-premium-dark transition-all text-xs font-semibold text-white/95 active:scale-95">北京</button>
                <button onclick="selectCity('上海')" class="py-2 px-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-green hover:bg-premium-dark transition-all text-xs font-semibold text-white/95 active:scale-95">上海</button>
                <button onclick="selectCity('广州')" class="py-2 px-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-green hover:bg-premium-dark transition-all text-xs font-semibold text-white/95 active:scale-95">广州</button>
                <button onclick="selectCity('深圳')" class="py-2 px-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-green hover:bg-premium-dark transition-all text-xs font-semibold text-white/95 active:scale-95">深圳</button>
                <button onclick="selectCity('杭州')" class="py-2 px-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-green hover:bg-premium-dark transition-all text-xs font-semibold text-white/95 active:scale-95">杭州</button>
                <button onclick="selectCity('成都')" class="py-2 px-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-green hover:bg-premium-dark transition-all text-xs font-semibold text-white/95 active:scale-95">成都</button>
            </div>
            
            <!-- Custom input -->
            <div class="space-y-2 text-left">
                <label class="text-[10px] text-premium-text font-bold block">或手动输入城市/区县名：</label>
                <div class="flex gap-2">
                    <input type="text" id="custom-city-input" placeholder="如：武汉、南京、福州" 
                        class="flex-1 px-4 py-2.5 rounded-xl bg-premium-dark border border-premium-border focus:border-premium-green focus:outline-none transition-all text-xs text-white placeholder-premium-text/40 font-semibold" />
                    <button onclick="saveCustomCity()" class="px-4 py-2.5 rounded-xl bg-premium-green text-black font-bold text-xs hover:brightness-110 active:scale-95 transition-all">确认</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
