<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>记录餐后觉察 | 饮食觉察</title>
    <!-- Premium Google Fonts & Iconography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#08080a',
                        premium: {
                            dark: '#121217',
                            border: '#1e1e26',
                            text: '#7e7e90',
                            accent: '#ffffff',
                            green: '#10b981',
                            purple: '#8b5cf6',
                            pink: '#ec4899',
                            orange: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08080a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(236, 72, 153, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(18, 18, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .hover-glow {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hover-glow:hover {
            border-color: rgba(236, 72, 153, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="min-h-screen text-white font-sans p-4 md:p-8 relative selection:bg-white selection:text-black">

    <!-- Background Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[400px] h-[400px] rounded-full bg-premium-pink/3 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-premium-green/3 blur-[120px] pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-2xl mx-auto pb-24">

        <!-- Top Navigation -->
        <header class="flex justify-between items-center mb-10 pt-4">
            <a href="index.html" class="px-4 py-2 rounded-full border border-premium-border bg-premium-dark/40 hover:bg-premium-dark/80 hover:border-white/20 transition-all text-xs flex items-center gap-1.5 hover-glow">
                <iconify-icon icon="lucide:home" class="text-premium-purple"></iconify-icon>
                <span>返回主页</span>
            </a>
            <span class="text-xs text-premium-pink font-semibold">记录新餐点</span>
        </header>

        <!-- Page Header -->
        <section class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-2">记录餐后真实体感</h1>
            <p class="text-xs text-premium-text">
                觉察与反思，是对抗深夜决策失调的良药。
            </p>
        </section>

        <!-- Form Panel -->
        <main class="glass-panel p-6 md:p-8 rounded-[2.5rem] border border-premium-border relative overflow-hidden">
            <form id="reviewForm" class="space-y-6">
                <!-- 1. FOOD NAME -->
                <div class="space-y-2">
                    <label class="text-xs text-premium-text font-medium block">
                        吃了什么食品？
                    </label>
                    <input type="text" name="food_name" required placeholder="如：招牌骨汤麻辣烫配可乐"
                        class="w-full px-5 py-4 rounded-2xl bg-premium-dark border border-premium-border focus:border-premium-purple focus:outline-none transition-all text-sm placeholder-premium-text/40" />
                </div>

                <!-- 2. PRICE -->
                <div class="space-y-2">
                    <label class="text-xs text-premium-text font-medium block">
                        花费金额
                    </label>
                    <div class="relative">
                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-premium-green font-bold text-sm">¥</span>
                        <input type="number" step="0.1" name="price" required placeholder="0.00"
                            class="w-full pl-9 pr-5 py-4 rounded-2xl bg-premium-dark border border-premium-border focus:border-premium-green focus:outline-none transition-all text-sm placeholder-premium-text/40 font-bold" />
                    </div>
                </div>

                <!-- 3. FULLNESS -->
                <div class="space-y-2">
                    <label class="text-xs text-premium-text font-medium block">
                        胃部饱腹感
                    </label>
                    <input type="hidden" name="fullness" id="fullnessInput" value="2" />
                    <div class="grid grid-cols-3 gap-3" id="fullnessGroup">
                        <button type="button" data-value="1" onclick="selectFullness(1, this)"
                            class="py-3.5 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-orange transition-all text-xs flex flex-col items-center gap-1 opacity-70">
                            <span class="text-xl">😫</span>
                            <span class="font-bold">吃太撑了</span>
                        </button>
                        <button type="button" data-value="2" onclick="selectFullness(2, this)"
                            class="py-3.5 rounded-xl border border-premium-orange bg-[#30221a]/30 text-white font-bold transition-all text-xs flex flex-col items-center gap-1">
                            <span class="text-xl">😊</span>
                            <span class="font-bold">刚刚好</span>
                        </button>
                        <button type="button" data-value="3" onclick="selectFullness(3, this)"
                            class="py-3.5 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-orange transition-all text-xs flex flex-col items-center gap-1 opacity-70">
                            <span class="text-xl">🤤</span>
                            <span class="font-bold">还想吃点</span>
                        </button>
                    </div>
                </div>

                <!-- 4. MOOD -->
                <div class="space-y-2">
                    <label class="text-xs text-premium-text font-medium block">
                        此刻心情
                    </label>
                    <input type="hidden" name="mood" id="moodInput" value="satisfied" />
                    <div class="grid grid-cols-5 gap-2" id="moodGroup">
                        <button type="button" data-value="happy" onclick="selectMood('happy', this)"
                            class="py-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">😄</span>
                            <span class="text-[9px] font-bold mt-1 text-premium-text">开心</span>
                        </button>
                        <button type="button" data-value="satisfied" onclick="selectMood('satisfied', this)"
                            class="py-3 rounded-xl border border-premium-pink bg-[#301a25]/30 text-white font-bold transition-all flex flex-col items-center justify-center">
                            <span class="text-2xl">满足</span>
                            <span class="text-[9px] font-bold mt-1 text-premium-text">满足</span>
                        </button>
                        <button type="button" data-value="neutral" onclick="selectMood('neutral', this)"
                            class="py-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">😐</span>
                            <span class="text-[9px] font-bold mt-1 text-premium-text">平静</span>
                        </button>
                        <button type="button" data-value="regretful" onclick="selectMood('regretful', this)"
                            class="py-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">😓</span>
                            <span class="text-[9px] font-bold mt-1 text-premium-text">郁闷</span>
                        </button>
                        <button type="button" data-value="guilty" onclick="selectMood('guilty', this)"
                            class="py-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">☠️</span>
                            <span class="text-[9px] font-bold mt-1 text-premium-text">愧疚</span>
                        </button>
                    </div>
                </div>

                <!-- 5. REGRET SCORE (STARS) -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-premium-text font-medium block">
                            明早后悔度预测
                        </label>
                        <span class="text-xs text-premium-pink font-bold" id="regretLabel">3 星 (日常小放纵)</span>
                    </div>
                    <input type="hidden" name="regret" id="regretInput" value="3" />
                    <!-- Interative stars -->
                    <div class="flex justify-center items-center py-4 bg-premium-dark/40 border border-premium-border rounded-2xl gap-3">
                        <button type="button" onclick="setRegret(1)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-1" class="text-3xl text-premium-pink fill-premium-pink"></iconify-icon></button>
                        <button type="button" onclick="setRegret(2)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-2" class="text-3xl text-premium-pink fill-premium-pink"></iconify-icon></button>
                        <button type="button" onclick="setRegret(3)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-3" class="text-3xl text-premium-pink fill-premium-pink"></iconify-icon></button>
                        <button type="button" onclick="setRegret(4)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-4" class="text-3xl text-gray-700"></iconify-icon></button>
                        <button type="button" onclick="setRegret(5)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-5" class="text-3xl text-gray-700"></iconify-icon></button>
                    </div>
                </div>

                <!-- 6. NOTE -->
                <div class="space-y-2">
                    <label class="text-xs text-premium-text font-medium block">
                        觉察与评注
                    </label>
                    <textarea name="note" placeholder="写写点外卖时的复杂心境，或者吃了这个食物之后身体的感受..."
                        class="w-full h-28 px-5 py-4 rounded-2xl bg-premium-dark border border-premium-border focus:border-premium-purple focus:outline-none transition-all text-sm placeholder-premium-text/30 leading-relaxed"></textarea>
                </div>

                <!-- SUBMIT BUTTON -->
                <div class="pt-4">
                    <button type="submit" class="w-full py-4 rounded-full bg-premium-pink text-white font-bold text-sm hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5 shadow-lg">
                        <iconify-icon icon="lucide:activity" class="text-lg"></iconify-icon>
                        <span>确认写入觉察数据库</span>
                    </button>
                </div>

            </form>
        </main>

    </div>

    <!-- Script Block -->
    <script>
        const SUPABASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? window.location.origin
            : 'https://lqqdhlxcfmdgxdayxxsi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcWRobHhjZm1kZ3hkYXl4eHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2OTQzNzAsImV4cCI6MjA4NTI3MDM3MH0.TkFKzi_UgHjvzgK1zH4thEjQ3fuuotAPwjfkwptdvqU';

        // Select Fullness
        function selectFullness(val, el) {
            document.getElementById('fullnessInput').value = val;
            const siblings = document.getElementById('fullnessGroup').querySelectorAll('button');
            siblings.forEach(btn => {
                btn.className = "py-3.5 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-orange transition-all text-xs flex flex-col items-center gap-1 opacity-70 scale-95";
            });
            el.className = "py-3.5 rounded-xl border border-premium-orange bg-[#30221a]/30 text-white font-bold transition-all text-xs flex flex-col items-center gap-1 scale-100";
            triggerLightHaptic();
        }

        // Select Mood
        function selectMood(val, el) {
            document.getElementById('moodInput').value = val;
            const siblings = document.getElementById('moodGroup').querySelectorAll('button');
            siblings.forEach(btn => {
                btn.className = "py-3 rounded-xl bg-premium-dark/60 border border-premium-border hover:border-premium-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95";
            });
            el.className = "py-3 rounded-xl border border-premium-pink bg-[#301a25]/30 text-white font-bold transition-all flex flex-col items-center justify-center scale-100";
            triggerLightHaptic();
        }

        // Set Regret score
        const regretDescriptions = {
            1: "1 星 (对冲完美，毫无负罪)",
            2: "2 星 (偶有小馋，心安理得)",
            3: "3 星 (日常宵夜，微微后悔)",
            4: "4 星 (热量超载，有些愧疚)",
            5: "5 星 (脑子发热，极度后悔)"
        };

        function setRegret(val) {
            document.getElementById('regretInput').value = val;
            document.getElementById('regretLabel').innerText = regretDescriptions[val];

            for (let i = 1; i <= 5; i++) {
                const star = document.getElementById(`star-${i}`);
                if (i <= val) {
                    star.className = "text-3xl text-premium-pink fill-premium-pink transition-colors";
                } else {
                    star.className = "text-3xl text-gray-700 transition-colors";
                }
            }
            triggerLightHaptic();
        }

        function generateUserToken() {
            const token = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('user_token', token);
            return token;
        }

        function triggerLightHaptic() {
            if (navigator.vibrate) navigator.vibrate(12);
        }

        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `fixed top-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl shadow-xl z-50 text-xs font-semibold flex items-center gap-2.5 transition-all duration-300 transform -translate-y-4 opacity-0 ${
                isSuccess ? 'bg-premium-green/10 text-premium-green border border-premium-green/20' : 'bg-premium-pink/10 text-premium-pink border border-premium-pink/20'
            }`;
            toast.innerHTML = `<iconify-icon icon="${isSuccess ? 'lucide:check-circle' : 'lucide:alert-circle'}" class="text-sm"></iconify-icon><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('-translate-y-4', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 2000);
            }, 2000);
        }

        // Submit form
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const data = {
                food_name: form.food_name.value,
                fullness: parseInt(form.fullness.value) || 2,
                mood: form.mood.value || 'satisfied',
                regret_score: parseInt(form.regret.value),
                price: parseFloat(form.price.value) || 0,
                note: form.note.value,
                created_at: new Date().toISOString(),
                user_token: localStorage.getItem('user_token') || generateUserToken()
            };

            if (!data.food_name) {
                showToast('请填写吃了什么', false);
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/meal_reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showToast('🎉 记录成功！数据已同步云端复盘');
                    setTimeout(() => {
                        window.location.href = 'review-history.html';
                    }, 1200);
                } else {
                    throw new Error('Save error');
                }
            } catch (error) {
                console.warn('Network offline, saving review to local reviews database:', error);
                
                const history = JSON.parse(localStorage.getItem('selection_history') || '[]');
                history.push({
                    ...data,
                    id: 'local_' + Date.now(),
                    created_at: new Date().toISOString()
                });
                localStorage.setItem('selection_history', JSON.stringify(history));

                showToast('💡 线上休眠，数据已成功存入本地数据库！');
                setTimeout(() => {
                    window.location.href = 'review-history.html';
                }, 1200);
            }
        });
    </script>
</body>

</html>
