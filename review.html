<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>记录餐后觉察 | 饮食觉察 2.0</title>
    <!-- Y2K Acid Fonts & Iconography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#08080c',
                        acid: {
                            green: '#00ff66',
                            green_dark: '#00cc52',
                            purple: '#a12cff',
                            pink: '#ff3e83',
                            orange: '#ff8800'
                        },
                        cyber: {
                            card: '#12121a',
                            border: '#1a1a26',
                            text: '#8a8a9e'
                        }
                    },
                    fontFamily: {
                        syne: ['Syne', 'sans-serif'],
                        grotesk: ['Space Grotesk', 'monospace'],
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    boxShadow: {
                        'acid-green': '0 0 20px rgba(0, 255, 102, 0.25)',
                        'acid-purple': '0 0 20px rgba(161, 44, 255, 0.25)',
                        'acid-pink': '0 0 20px rgba(255, 62, 131, 0.25)',
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08080c;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 62, 131, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 102, 0.05) 0px, transparent 50%);
            overflow-x: hidden;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.2) 50%
            );
            background-size: 100% 4px;
            z-index: 99;
            opacity: 0.3;
        }

        .glass-panel {
            background: rgba(18, 18, 26, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hover-neon {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .hover-neon:hover {
            border-color: rgba(255, 62, 131, 0.3);
            box-shadow: 0 0 20px rgba(255, 62, 131, 0.15);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="min-h-screen text-white font-outfit p-4 md:p-8 relative selection:bg-acid-green selection:text-black">
    <div class="scanlines"></div>

    <!-- Background Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[400px] h-[400px] rounded-full bg-acid-pink/5 blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-acid-green/5 blur-[120px] pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-2xl mx-auto pb-24">

        <!-- Top Navigation -->
        <header class="flex justify-between items-center mb-10 pt-4">
            <a href="index.html" class="px-4 py-2 rounded-full border border-cyber-border bg-cyber-card/40 hover:bg-cyber-card/80 hover:border-acid-purple transition-all text-xs font-grotesk flex items-center gap-1.5 hover-neon">
                <iconify-icon icon="lucide:home" class="text-acid-purple"></iconify-icon>
                <span>返回主页</span>
            </a>
            <span class="font-grotesk font-bold tracking-widest text-xs text-acid-pink">[NEW_DIET_ENTRY]</span>
        </header>

        <!-- Page Header -->
        <section class="text-center mb-8">
            <h1 class="font-syne font-extrabold text-3xl tracking-tight mb-2">🧠 记录你刚吃完的觉察</h1>
            <p class="font-grotesk text-cyber-text text-xs uppercase tracking-wider">
                [AWARENESS_LOGGING_ENGINE // 身体与理性的真实刻度]
            </p>
        </section>

        <!-- Form Panel -->
        <main class="glass-panel p-6 md:p-8 rounded-[2.5rem] border border-cyber-border shadow-glass relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-acid-pink/5 rounded-full blur-2xl"></div>

            <form id="reviewForm" class="space-y-6">
                <!-- 1. FOOD NAME -->
                <div class="space-y-2">
                    <label class="font-grotesk text-xs uppercase tracking-widest text-acid-purple font-bold block">
                        [01_吃了什么 / FOOD_NAME]
                    </label>
                    <input type="text" name="food_name" required placeholder="如：招牌骨汤麻辣烫配可乐"
                        class="w-full px-5 py-4 rounded-2xl bg-cyber-card border border-cyber-border focus:border-acid-purple focus:shadow-acid-purple focus:outline-none transition-all text-sm placeholder-cyber-text/50" />
                </div>

                <!-- 2. PRICE -->
                <div class="space-y-2">
                    <label class="font-grotesk text-xs uppercase tracking-widest text-acid-green font-bold block">
                        [02_吃这顿花了多少钱 / ORDER_COST]
                    </label>
                    <div class="relative">
                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-acid-green font-grotesk font-bold text-sm">¥</span>
                        <input type="number" step="0.1" name="price" required placeholder="0.00"
                            class="w-full pl-9 pr-5 py-4 rounded-2xl bg-cyber-card border border-cyber-border focus:border-acid-green focus:shadow-acid-green focus:outline-none transition-all text-sm placeholder-cyber-text/50 font-grotesk font-bold" />
                    </div>
                </div>

                <!-- 3. FULLNESS -->
                <div class="space-y-2">
                    <label class="font-grotesk text-xs uppercase tracking-widest text-acid-orange font-bold block">
                        [03_胃里撑不撑 / FULLNESS_SCALE]
                    </label>
                    <input type="hidden" name="fullness" id="fullnessInput" value="2" />
                    <div class="grid grid-cols-3 gap-3" id="fullnessGroup">
                        <button type="button" data-value="1" onclick="selectFullness(1, this)"
                            class="py-3.5 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-orange transition-all font-grotesk text-xs flex flex-col items-center gap-1 opacity-70">
                            <span class="text-xl">😫</span>
                            <span class="font-bold">吃太撑了</span>
                        </button>
                        <button type="button" data-value="2" onclick="selectFullness(2, this)"
                            class="py-3.5 rounded-xl border border-acid-orange bg-[#2e1d12]/40 shadow-acid-orange text-white font-bold transition-all font-grotesk text-xs flex flex-col items-center gap-1">
                            <span class="text-xl">😊</span>
                            <span class="font-bold">刚刚好</span>
                        </button>
                        <button type="button" data-value="3" onclick="selectFullness(3, this)"
                            class="py-3.5 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-orange transition-all font-grotesk text-xs flex flex-col items-center gap-1 opacity-70">
                            <span class="text-xl">🤤</span>
                            <span class="font-bold">还想吃点</span>
                        </button>
                    </div>
                </div>

                <!-- 4. MOOD -->
                <div class="space-y-2">
                    <label class="font-grotesk text-xs uppercase tracking-widest text-acid-pink font-bold block">
                        [04_此刻的心理情绪 / EMOTIONAL_STATE]
                    </label>
                    <input type="hidden" name="mood" id="moodInput" value="satisfied" />
                    <div class="grid grid-cols-5 gap-2" id="moodGroup">
                        <button type="button" data-value="happy" onclick="selectMood('happy', this)"
                            class="py-3 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">😄</span>
                            <span class="text-[9px] font-bold mt-1 text-cyber-text">开心</span>
                        </button>
                        <button type="button" data-value="satisfied" onclick="selectMood('satisfied', this)"
                            class="py-3 rounded-xl border border-acid-pink bg-[#2e1222]/40 shadow-acid-pink text-white font-bold transition-all flex flex-col items-center justify-center">
                            <span class="text-2xl">满足</span>
                            <span class="text-[9px] font-bold mt-1 text-cyber-text">满足</span>
                        </button>
                        <button type="button" data-value="neutral" onclick="selectMood('neutral', this)"
                            class="py-3 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">😐</span>
                            <span class="text-[9px] font-bold mt-1 text-cyber-text">平静</span>
                        </button>
                        <button type="button" data-value="regretful" onclick="selectMood('regretful', this)"
                            class="py-3 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">😓</span>
                            <span class="text-[9px] font-bold mt-1 text-cyber-text">郁闷</span>
                        </button>
                        <button type="button" data-value="guilty" onclick="selectMood('guilty', this)"
                            class="py-3 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95">
                            <span class="text-2xl">☠️</span>
                            <span class="text-[9px] font-bold mt-1 text-cyber-text">愧疚</span>
                        </button>
                    </div>
                </div>

                <!-- 5. REGRET SCORE (STARS) -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="font-grotesk text-xs uppercase tracking-widest text-acid-pink font-bold block">
                            [05_这顿饭的明早后悔指数 / REGRET_INDEX]
                        </label>
                        <span class="font-grotesk text-xs text-acid-pink font-bold" id="regretLabel">3 星 (日常小放纵)</span>
                    </div>
                    <input type="hidden" name="regret" id="regretInput" value="3" />
                    <!-- Interative glowing stars -->
                    <div class="flex justify-center items-center py-4 bg-cyber-card/40 border border-cyber-border rounded-2xl gap-3">
                        <button type="button" onclick="setRegret(1)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-1" class="text-3xl text-acid-pink fill-acid-pink"></iconify-icon></button>
                        <button type="button" onclick="setRegret(2)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-2" class="text-3xl text-acid-pink fill-acid-pink"></iconify-icon></button>
                        <button type="button" onclick="setRegret(3)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-3" class="text-3xl text-acid-pink fill-acid-pink"></iconify-icon></button>
                        <button type="button" onclick="setRegret(4)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-4" class="text-3xl text-gray-700"></iconify-icon></button>
                        <button type="button" onclick="setRegret(5)" class="star-btn transition-transform active:scale-90"><iconify-icon icon="lucide:star" id="star-5" class="text-3xl text-gray-700"></iconify-icon></button>
                    </div>
                </div>

                <!-- 6. NOTE -->
                <div class="space-y-2">
                    <label class="font-grotesk text-xs uppercase tracking-widest text-cyber-text font-bold block">
                        [06_写两句吐槽或赞美吧 / DIET_AWARENESS_NOTE]
                    </label>
                    <textarea name="note" placeholder="写写点外卖时的复杂心境，或者吃了这个食物之后身体的奇妙感受..."
                        class="w-full h-28 px-5 py-4 rounded-2xl bg-cyber-card border border-cyber-border focus:border-acid-purple focus:shadow-acid-purple focus:outline-none transition-all text-sm placeholder-cyber-text/50 leading-relaxed"></textarea>
                </div>

                <!-- SUBMIT BUTTON -->
                <div class="pt-4">
                    <button type="submit" class="w-full py-4 rounded-full bg-acid-pink text-white font-syne font-extrabold text-sm tracking-wider shadow-acid-pink active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
                        <iconify-icon icon="lucide:activity" class="text-lg"></iconify-icon>
                        <span>🛡️ 写入觉察数据库 (DB_WRITE)</span>
                    </button>
                </div>

            </form>
        </main>

    </div>

    <!-- Script Block -->
    <script>
        const SUPABASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? window.location.origin
            : 'https://lqqdhlxcfmdgxdayxxsi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcWRobHhjZm1kZ3hkYXl4eHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2OTQzNzAsImV4cCI6MjA4NTI3MDM3MH0.TkFKzi_UgHjvzgK1zH4thEjQ3fuuotAPwjfkwptdvqU';

        // Select Fullness pills
        function selectFullness(val, el) {
            document.getElementById('fullnessInput').value = val;
            const siblings = document.getElementById('fullnessGroup').querySelectorAll('button');
            siblings.forEach(btn => {
                btn.className = "py-3.5 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-orange transition-all font-grotesk text-xs flex flex-col items-center gap-1 opacity-70 scale-95";
            });
            el.className = "py-3.5 rounded-xl border border-acid-orange bg-[#2e1d12]/40 shadow-acid-orange text-white font-bold transition-all font-grotesk text-xs flex flex-col items-center gap-1 scale-100";
            triggerLightHaptic();
        }

        // Select Mood emojis
        function selectMood(val, el) {
            document.getElementById('moodInput').value = val;
            const siblings = document.getElementById('moodGroup').querySelectorAll('button');
            siblings.forEach(btn => {
                btn.className = "py-3 rounded-xl bg-cyber-card/60 border border-cyber-border hover:border-acid-pink transition-all flex flex-col items-center justify-center opacity-65 scale-95";
            });
            el.className = "py-3 rounded-xl border border-acid-pink bg-[#2e1222]/40 shadow-acid-pink text-white font-bold transition-all flex flex-col items-center justify-center scale-100";
            triggerLightHaptic();
        }

        // Set Regret score stars
        const regretDescriptions = {
            1: "1 星 (完美对冲，零悔恨)",
            2: "2 星 (偶有小馋，心安理得)",
            3: "3 星 (日常宵夜，微罪恶)",
            4: "4 星 (热量超载，悔恨交加)",
            5: "5 星 (脑子坏掉，痛不欲生)"
        };

        function setRegret(val) {
            document.getElementById('regretInput').value = val;
            document.getElementById('regretLabel').innerText = regretDescriptions[val];

            for (let i = 1; i <= 5; i++) {
                const star = document.getElementById(`star-${i}`);
                if (i <= val) {
                    star.className = "text-3xl text-acid-pink fill-acid-pink shadow-acid-pink animate-pop";
                } else {
                    star.className = "text-3xl text-gray-700 shadow-none";
                }
            }
            triggerLightHaptic();
        }

        // Generate anonymous user token
        function generateUserToken() {
            const token = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('user_token', token);
            return token;
        }

        // Haptic utility
        function triggerLightHaptic() {
            if (navigator.vibrate) navigator.vibrate(15);
        }

        // Toast alert
        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `fixed top-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl shadow-xl z-50 text-xs font-grotesk font-bold flex items-center gap-2.5 transition-all duration-300 transform -translate-y-4 opacity-0 ${
                isSuccess ? 'bg-[#00ff66]/15 text-[#00ff66] border border-[#00ff66]/30' : 'bg-[#ff3e83]/15 text-[#ff3e83] border border-[#ff3e83]/30'
            }`;
            toast.innerHTML = `<iconify-icon icon="${isSuccess ? 'lucide:check-circle' : 'lucide:alert-circle'}" class="text-base"></iconify-icon><span>${message}</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('-translate-y-4', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // Submit form
        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const data = {
                food_name: form.food_name.value,
                fullness: parseInt(form.fullness.value) || 2,
                mood: form.mood.value || 'satisfied',
                regret_score: parseInt(form.regret.value),
                price: parseFloat(form.price.value) || 0,
                note: form.note.value,
                created_at: new Date().toISOString(),
                user_token: localStorage.getItem('user_token') || generateUserToken()
            };

            if (!data.food_name) {
                showToast('⚠️ 扫兴！请务必填写你吃了什么...', false);
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/meal_reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showToast('🎉 记录成功！数据已同步云端复盘');
                    setTimeout(() => {
                        window.location.href = 'review-history.html';
                    }, 1200);
                } else {
                    throw new Error('Save error');
                }
            } catch (error) {
                console.warn('Network offline or paused Supabase, saving review to local reviews database:', error);
                
                // Save to local storage database backup
                const history = JSON.parse(localStorage.getItem('selection_history') || '[]');
                history.push({
                    ...data,
                    id: 'local_' + Date.now(),
                    created_at: new Date().toISOString()
                });
                localStorage.setItem('selection_history', JSON.stringify(history));

                showToast('💡 线上休眠，数据已成功存入本地数据库！');
                setTimeout(() => {
                    window.location.href = 'review-history.html';
                }, 1200);
            }
        });
    </script>
</body>

</html>
