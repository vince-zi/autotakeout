<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>推荐结果 - 饮食觉察</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,700&f[]=pally@400,500,700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#fffcf8',
                        dusty: {
                            rose: '#d9a59d',
                            'rose-light': '#f4e4e1',
                            'rose-dark': '#b57b72',
                        },
                        sage: {
                            green: '#c8d5c4',
                            'green-light': '#e8f0e6',
                            'green-dark': '#8a9a85',
                        },
                        charcoal: '#5c5552',
                        'text-light': '#948c89'
                    },
                    fontFamily: {
                        serif: ['Zodiak', 'serif'],
                        sans: ['Pally', 'sans-serif'],
                    },
                    boxShadow: {
                        'bubble': '0 8px 24px -6px rgba(217, 165, 157, 0.25)',
                        'bubble-hover': '0 12px 32px -8px rgba(217, 165, 157, 0.4)',
                        'glass': '0 8px 32px 0 rgba(217, 165, 157, 0.15)',
                        'card-soft': '0 10px 40px -10px rgba(0,0,0,0.06)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'bounce-soft': 'bounce-soft 2.5s ease-in-out infinite',
                        'pulse-soft': 'pulse-soft 2s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        'bounce-soft': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        'pulse-soft': {
                            '0%, 100%': { opacity: '0.6' },
                            '50%': { opacity: '1' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .recommendation-card {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Hover animations */
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -12px rgba(217, 165, 157, 0.25);
        }
    </style>
</head>

<body class="min-h-screen bg-cream text-charcoal font-sans p-6 pb-20 relative overflow-x-hidden">

    <!-- Background Blobs -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-sage-green/20 blur-[120px] animate-float pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-dusty-rose/15 blur-[120px] animate-float-delayed pointer-events-none z-0"></div>

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto relative z-10 w-full">

        <!-- Header -->
        <header class="text-center mb-10 pt-4">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-text-light text-sm mb-4 hover:text-dusty-rose transition-colors font-medium">
                <iconify-icon icon="lucide:arrow-left" class="text-base"></iconify-icon> 返回重新选择
            </a>
            <h1 class="font-serif text-3xl md:text-4xl text-charcoal font-bold mb-2 flex items-center justify-center gap-2">
                <span>🍽️</span> 今日定制推荐
            </h1>
            <p class="text-text-light text-sm" id="subContext">智能分析你此刻的饥饿与心情...</p>
        </header>

        <!-- Loading State -->
        <div id="loader" class="bg-white/40 backdrop-blur-md border border-white/60 rounded-[2.5rem] p-12 shadow-glass text-center min-h-[350px] flex flex-col items-center justify-center transition-all duration-500">
            <div class="text-6xl mb-6 animate-bounce-soft" id="loaderEmoji">🍜</div>
            <h2 class="font-serif text-2xl font-bold text-charcoal mb-3" id="loaderTitle">正在为你寻找慰藉...</h2>
            <p class="text-text-light text-base mb-8 leading-relaxed max-w-sm" id="loaderSubtitle">让美食治愈此刻的你</p>
            <div class="flex flex-col items-center gap-3">
                <div class="w-10 h-10 border-4 border-sage-green/30 border-t-sage-green rounded-full animate-spin"></div>
                <span class="text-xs font-bold text-sage-green-dark tracking-widest uppercase animate-pulse-soft">正在智能配餐中</span>
            </div>
        </div>

        <!-- Result State (Hidden initially) -->
        <div id="result-state" class="hidden space-y-8">
            <!-- 推荐菜品列表 -->
            <div id="recommendations-container" class="space-y-6">
                <!-- 动态生成 5 个推荐卡片 -->
            </div>

            <!-- 换换口味备选 -->
            <div id="alternatives-box" class="hidden bg-white/40 backdrop-blur-md border border-white/60 rounded-[2.5rem] p-6 sm:p-8 shadow-glass space-y-4">
                <h3 class="font-serif text-lg font-bold text-charcoal flex items-center gap-2">
                    <iconify-icon icon="lucide:sparkles" class="text-dusty-rose"></iconify-icon>
                    如果上面的不合胃口，还可以试试：
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="alternatives-container">
                    <!-- 动态生成 2 个备选卡片 -->
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <button onclick="reRecommend()" class="flex-1 py-4.5 rounded-full bg-white border border-[#ebdcd8] text-text-light font-bold text-base shadow-sm hover:shadow-md hover:border-dusty-rose/30 transition-all flex items-center justify-center gap-2">
                    <iconify-icon icon="lucide:refresh-cw" class="text-lg"></iconify-icon>
                    <span>换一批试试</span>
                </button>
                <a href="index.html" class="flex-1 py-4.5 rounded-full bg-dusty-rose hover:bg-dusty-rose-dark text-white font-bold text-base shadow-bubble hover:shadow-bubble-hover hover:-translate-y-0.5 transition-all text-center flex items-center justify-center gap-2">
                    <iconify-icon icon="lucide:rotate-ccw" class="text-lg"></iconify-icon>
                    <span>重新做决策</span>
                </a>
            </div>
        </div>

        <!-- Error State (Hidden initially) -->
        <div id="error-state" class="hidden bg-white/40 backdrop-blur-md border border-white/60 rounded-[2.5rem] p-12 shadow-glass text-center py-16">
            <span class="material-symbols-outlined text-6xl text-dusty-rose animate-pulse">sentiment_dissatisfied</span>
            <h2 class="font-serif text-2xl font-bold text-charcoal mt-4 mb-2">获取推荐遇到问题</h2>
            <p id="error-msg" class="text-text-light text-sm mb-8">可能服务器开小差了，请稍后再试</p>
            <button onclick="location.href='index.html'" class="px-8 py-3.5 rounded-full bg-dusty-rose text-white font-bold shadow-bubble hover:shadow-bubble-hover transition-all">重新开始</button>
        </div>

    </div>

    <!-- Script Block -->
    <script>
        const SUPABASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? window.location.origin
            : 'https://lqqdhlxcfmdgxdayxxsi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcWRobHhjZm1kZ3hkYXl4eHNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2OTQzNzAsImV4cCI6MjA4NTI3MDM3MH0.TkFKzi_UgHjvzgK1zH4thEjQ3fuuotAPwjfkwptdvqU';

        const userChoices = JSON.parse(sessionStorage.getItem('userChoices') || '{}');
        const choiceLabels = JSON.parse(sessionStorage.getItem('choiceLabels') || '{}');

        // 情感等待文案
        const copyTemplates = {
            'nighttime_stressed': { emoji: '🌙', title: '夜深了，你还在默默坚持', subtitle: '放下那些沉重，让一份暖胃的美食在这个深夜拥抱你。', loader: '正在为你寻找最能解压的烟火气...' },
            'nighttime_homesick': { emoji: '🏠', title: '思念家乡的深夜', subtitle: '虽然山高水长，但那些带有家乡印记的味道，能瞬间拉近你的思绪。', loader: '正在寻找能唤醒家乡记忆的温暖味道...' },
            'nighttime_finished_work': { emoji: '🎉', title: '终于大功告成了！', subtitle: '属于你自己的狂欢时间已到，用一份极致美味，为今天的辛劳画上句点！', loader: '正在为你挑选最畅快的庆功美食...' },
            'nighttime_lonely': { emoji: '🌃', title: '一个人，也要静静享受', subtitle: '食物是最好的陪伴，在这个宁静的夜晚，它会温柔地温暖你的身心。', loader: '正在挑选适合一人享用的暖心宵夜...' },
            'daytime_stressed': { emoji: '😮‍💨', title: '今天有些辛苦吧', subtitle: '深呼吸一下，暂时按下工作的暂停键，用美食给自己的大脑放个假。', loader: '正在寻找能让你喘口气的舒适味道...' },
            'daytime_homesick': { emoji: '🥘', title: '突然好想吃那口家常菜', subtitle: '一碗热气腾腾的家常饭，是抚平思乡之情最直接的良药。', loader: '正在寻找最还原妈妈手艺的家常小馆...' },
            'daytime_finished_work': { emoji: '✨', title: '忙完了，一身轻松！', subtitle: '是时候去吃一顿好吃的，好好犒劳一下这个辛苦但饱满的自己了！', loader: '正在搜罗极具诱惑的美味犒劳选项...' },
            'daytime_lonely': { emoji: '🍽️', title: '舒适的一人食时光', subtitle: '独处本就是一种美妙的滋味，慢慢品味这顿不被打扰的美好一餐。', loader: '正在挑选精美的一人食套餐...' },
            'default': { emoji: '🍜', title: '正在为你量身推荐', subtitle: '让美食治愈此刻的你，享受生活的每一口香甜。', loader: '正在智能计算最契合你当前状态的美食...' }
        };

        const PLATFORMS = {
            meituan: { name: '美团外卖', emoji: '🛵', bg: 'bg-[#FFD000]/10', border: 'border-[#FFD000]/30', text: 'text-[#5C3A00]', scheme: (kw) => `waimai://search?keyword=${encodeURIComponent(kw)}`, web: (kw) => `https://waimai.meituan.com/search?keyword=${encodeURIComponent(kw)}` },
            eleme: { name: '饿了么', emoji: '💙', bg: 'bg-[#008CFF]/10', border: 'border-[#008CFF]/30', text: 'text-[#004A8C]', scheme: (kw) => `eleme://search?keyword=${encodeURIComponent(kw)}`, web: (kw) => `https://h5.ele.me/msite/search?keyword=${encodeURIComponent(kw)}` },
            jd: { name: '京东秒送', emoji: '🍎', bg: 'bg-[#DF2D2D]/10', border: 'border-[#DF2D2D]/30', text: 'text-[#8A1414]', scheme: (kw) => `openapp.jdmobile://virtual?params=${encodeURIComponent(JSON.stringify({ category: 'jump', des: 'jdMartHome' }))}`, web: (kw) => `https://jdmart.jd.com/search?keyword=${encodeURIComponent(kw)}` }
        };

        // 获取匿名用户 Token
        function getOrGenerateToken() {
            let token = localStorage.getItem('user_token');
            if (!token) {
                token = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('user_token', token);
            }
            return token;
        }

        // 页面提示文案设置
        function updateLoadingTexts() {
            const time = userChoices.time_of_day || 'daytime';
            const mood = userChoices.mood || 'stressed';
            const key = `${time}_${mood}`;
            const copy = copyTemplates[key] || copyTemplates['default'];

            document.getElementById('loaderEmoji').textContent = copy.emoji;
            document.getElementById('loaderTitle').textContent = copy.title;
            document.getElementById('loaderSubtitle').textContent = copy.subtitle;
            document.getElementById('subContext').textContent = `${choiceLabels.time || '此刻'} · ${choiceLabels.mood || '正常情绪'} · 预算${choiceLabels.budget || '日常'}`;
        }

        // 复制剪贴板
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('📋 已自动复制商家与菜品名！');
                return true;
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 已自动复制商家与菜品名！');
                return true;
            }
        }

        // 显示 Toast 提示
        function showToast(message, isSuccess = true) {
            const toast = document.createElement('div');
            toast.className = `fixed top-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-2xl shadow-xl z-50 text-sm font-bold flex items-center gap-2.5 transition-all duration-300 transform -translate-y-4 opacity-0 ${
                isSuccess ? 'bg-[#c8d5c4] text-[#4f594d] border border-[#a4bca0]' : 'bg-red-50 text-red-700 border border-red-200'
            }`;
            toast.innerHTML = `<iconify-icon icon="${isSuccess ? 'lucide:check-circle' : 'lucide:alert-circle'}" class="text-lg"></iconify-icon><span>${message}</span>`;
            document.body.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.classList.remove('-translate-y-4', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 跳转外卖平台与复制
        function goToOrder(platformKey, keyword) {
            const plat = PLATFORMS[platformKey] || PLATFORMS.meituan;
            copyToClipboard(keyword);

            // Set a flag to show feedback section on return
            sessionStorage.setItem('pendingOrder', JSON.stringify({ keyword, timestamp: Date.now() }));

            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            if (isMobile) {
                // Try launching app
                window.location.href = plat.scheme(keyword);
                
                // Fallback to web link if app doesn't open
                setTimeout(() => {
                    window.location.href = plat.web(keyword);
                }, 1800);
            } else {
                // On desktop open in new tab
                window.open(plat.web(keyword), '_blank');
            }
        }

        // 我已下单：直接存库
        async function confirmOrdered(foodName, estimatedPrice, regretScore, restaurant, platform) {
            const userToken = getOrGenerateToken();

            const orderData = {
                user_token: userToken,
                food_name: foodName,
                price: parseFloat(estimatedPrice) || 0,
                fullness: 2, // 刚好
                mood: 'satisfied', // 满足
                regret_score: regretScore || 2,
                note: `通过饮食觉察智能下单: ${restaurant || '未知商家'} (${platform === 'meituan' ? '美团' : platform === 'eleme' ? '饿了么' : '京东秒送'})`,
                created_at: new Date().toISOString()
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/meal_reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    showToast('🎉 下单成功，记录已存入复盘数据！');
                    // 清除缓存的备选食品列表
                    sessionStorage.removeItem('excludedFoods');
                    setTimeout(() => {
                        window.location.href = 'review-history.html';
                    }, 1200);
                } else {
                    throw new Error('Save failed');
                }
            } catch (e) {
                console.warn('Network error or paused Supabase, saving to local history:', e);
                
                // Fallback to local storage history
                const history = JSON.parse(localStorage.getItem('selection_history') || '[]');
                history.push({
                    ...orderData,
                    id: 'local_' + Date.now(),
                    created_at: new Date().toISOString()
                });
                localStorage.setItem('selection_history', JSON.stringify(history));

                showToast('💡 线上服务休眠中，下单已成功存入本地数据！');
                setTimeout(() => {
                    window.location.href = 'review-history.html';
                }, 1200);
            }
        }

        // 智能构建推荐卡片
        function renderRecommendations(data) {
            const container = document.getElementById('recommendations-container');
            container.innerHTML = '';

            const recs = data.recommendations || [];
            recs.forEach((rec, index) => {
                const plat = PLATFORMS[rec.platform] || PLATFORMS.meituan;
                
                // 渲染后悔指数的星星
                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    const active = i <= rec.regret_score;
                    starsHtml += `<iconify-icon icon="lucide:star" class="text-sm ${active ? 'text-dusty-rose fill-dusty-rose' : 'text-gray-200'}" style="margin-right: 2px;"></iconify-icon>`;
                }

                // 排除重合关键字以便下一次过滤
                const jumpKeyword = rec.jump_keyword || `${rec.restaurant} ${rec.food_name}`;

                const card = document.createElement('div');
                card.className = `recommendation-card bg-white rounded-[2rem] border border-[#f5ecea] p-6 shadow-card-soft hover-lift delay-${(index + 1) * 100}`;
                card.innerHTML = `
                    <div class="flex flex-col gap-4">
                        <!-- Top header -->
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-2xl ${plat.bg} ${plat.border} border flex items-center justify-center text-2xl shrink-0">
                                    ${plat.emoji}
                                </div>
                                <div>
                                    <h3 class="font-serif text-lg md:text-xl font-bold text-charcoal leading-tight">${rec.food_name}</h3>
                                    <p class="text-xs text-text-light mt-0.5">${rec.restaurant || '推荐商家'}</p>
                                </div>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="font-serif text-xl font-bold text-dusty-rose-dark font-sans">¥${rec.estimated_price}</span>
                                <span class="block text-[10px] text-text-light mt-0.5 bg-gray-50 border border-gray-100 px-1.5 py-0.5 rounded-full font-bold uppercase">${plat.name}</span>
                            </div>
                        </div>

                        <!-- Reason -->
                        <p class="text-sm text-charcoal/85 leading-relaxed bg-[#fbf8f5] p-3 rounded-2xl border border-gray-50">
                            ✨ <span class="italic text-charcoal font-medium">推荐原因：</span>${rec.reason || '契合你当下的状态'}
                        </p>

                        <!-- Regret info & buttons -->
                        <div class="flex flex-col gap-3 pt-2 border-t border-dashed border-gray-100">
                            <div class="flex flex-wrap items-center justify-between gap-2 text-xs">
                                <div class="flex items-center gap-1.5 text-text-light font-medium">
                                    <span>明日后悔指数：</span>
                                    <span class="flex items-center">${starsHtml}</span>
                                </div>
                                ${rec.regret_reason ? `<span class="text-text-light/90 italic font-medium">👉 ${rec.regret_reason}</span>` : ''}
                            </div>

                            <div class="grid grid-cols-2 gap-3 mt-1.5">
                                <button onclick="goToOrder('${rec.platform}', '${jumpKeyword.replace(/'/g, "\\'")}')" class="py-3 rounded-xl bg-sage-green hover:bg-sage-green-dark text-white font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-1.5 hover:-translate-y-0.5">
                                    <iconify-icon icon="lucide:shopping-cart" class="text-base"></iconify-icon>
                                    <span>去下单</span>
                                </button>
                                <button onclick="confirmOrdered('${rec.food_name.replace(/'/g, "\\'")}', ${rec.estimated_price}, ${rec.regret_score}, '${(rec.restaurant || '').replace(/'/g, "\\'")}', '${rec.platform}')" class="py-3 rounded-xl bg-white border border-[#c8d5c4] text-sage-green-dark hover:bg-sage-green-light/20 font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-1.5 hover:-translate-y-0.5">
                                    <iconify-icon icon="lucide:check-circle" class="text-base"></iconify-icon>
                                    <span>我已下单</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // 渲染备选
            const alts = data.alternatives || [];
            const altContainer = document.getElementById('alternatives-container');
            const altBox = document.getElementById('alternatives-box');
            
            if (alts.length > 0) {
                altContainer.innerHTML = '';
                alts.forEach((alt, idx) => {
                    const plat = PLATFORMS[alt.platform] || PLATFORMS.meituan;
                    const jumpKeyword = alt.jump_keyword || `${alt.restaurant} ${alt.food_name}`;

                    const btn = document.createElement('button');
                    btn.onclick = () => goToOrder(alt.platform, jumpKeyword);
                    btn.className = "flex items-center justify-between p-4 bg-white rounded-2xl border border-gray-100 hover:border-dusty-rose/40 hover:bg-cream transition-all duration-300 text-left w-full shadow-sm group";
                    btn.innerHTML = `
                        <div class="flex items-center gap-3">

                altBox.classList.remove('hidden');
            } else {
                altBox.classList.add('hidden');
            }
        }

        // 调用推荐接口
        async function fetchRecommendations() {
            // Loading show
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('result-state').classList.add('hidden');
            document.getElementById('error-state').classList.add('hidden');

            try {
                // 获取已经生成推荐但用户拒绝的关键词列表
                const excludedFoods = JSON.parse(sessionStorage.getItem('excludedFoods') || '[]');

                const response = await fetch(`${SUPABASE_URL}/functions/v1/recommend`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        ...userChoices,
                        excluded_foods: excludedFoods
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // 将本次推荐菜品名称存入 excludedFoods 缓存，方便换一批时过滤
                    const currentExcludes = data.recommendations?.map(r => r.food_name) || [];
                    const newExcludes = [...new Set([...excludedFoods, ...currentExcludes])];
                    sessionStorage.setItem('excludedFoods', JSON.stringify(newExcludes));

                    // 渲染页面
                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('result-state').classList.remove('hidden');
                        renderRecommendations(data);
                    }, 800);
                } else {
                    const errTxt = await response.text();
                    console.error('API Error details:', errTxt);
                    throw new Error('API Error');
                }

                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('result-state').classList.remove('hidden');
                            renderRecommendations(localData);
                        }, 800);
                        return;

                            regret_reason: "已默认搭配金银花茶，解腻又防火"
                        },
                        {

        // 重新推荐（换一批）
        function reRecommend() {
            showToast('🔄 正在为你搜罗其他惊喜菜品...');
            fetchRecommendations();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            if (!userChoices.time_of_day) {
                // 如果没有数据，回退到主页
                window.location.href = 'index.html';
                return;
            }

            updateLoadingTexts();
            fetchRecommendations();
